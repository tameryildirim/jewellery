# Kuyumcu ERP — nginx site yapılandırması (Linux VPS alternatifi)
#
# Kurulum:
#   sudo cp deploy/nginx-kuyumcu.conf /etc/nginx/sites-available/kuyumcu
#   sudo ln -s /etc/nginx/sites-available/kuyumcu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   SSL: sudo certbot --nginx -d ornek.com -d www.ornek.com
#
# ornek.com'u kendi alan adınızla değiştirin.

server {
    listen 80;
    server_name ornek.com www.ornek.com;

    root /var/www/kuyumcu/web;   # apps/web/dist içeriği buraya kopyalanır
    index index.html;

    # API'yi Node sürecine aktar
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlıklar — uzun önbellek (dosya adları hash'li)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
