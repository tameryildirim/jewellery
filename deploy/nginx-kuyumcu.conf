# ═══════════════════════════════════════════════════════════════════════════
# Kuyumcu ERP — nginx site yapılandırması (Paket T-1 + F-6, MÜHÜR 6)
#
# ROL (MÜHÜR 6 / K7 — "statik sunum tek yol"):
#   nginx YALNIZ ters vekil + TLS sonlandırıcıdır. Blazor WASM istemcisi de
#   API SÜRECİNDEN sunulur (Program.cs UseBlazorFrameworkFiles + UseStaticFiles).
#   Bu yüzden burada `root`/`try_files`/statik `location` YOKTUR. Eskiden
#   /var/www/kuyumcu/web altından statik sunum yapılıyordu; o yol İKİNCİ bir
#   sunum hattıydı ve /assets/ location'ındaki add_header kalıtımı sunucu
#   düzeyi güvenlik başlıklarını SESSİZCE düşürüyordu.
#
# GÜVENLİK BAŞLIKLARI (MÜHÜR 6 / K5, K6 — "tek kaynak Program.cs"):
#   X-Frame-Options, X-Content-Type-Options, Content-Security-Policy,
#   Referrer-Policy ve Strict-Transport-Security BU DOSYADA YOKTUR.
#   Hepsi Kuyumcu.Api/Program.cs'ten TEK KOPYA gelir (HSTS: UseHsts).
#   Buraya add_header eklemeyin: başlık çift kopya gelir, iki katman ayrışır
#   ve dotnet/denetim.sh T-1 sayacı KIRMIZI döner.
#   NOT: 'preload' BU TURDA EKLENMEZ (Mehmet vetosu) — geri dönüşü zordur.
#
# KURULUM:
#   sudo cp deploy/nginx-kuyumcu.conf /etc/nginx/sites-available/kuyumcu
#   sudo ln -s /etc/nginx/sites-available/kuyumcu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SERTİFİKA: T-1 TLS'i ZORUNLU kılar, sertifika EDİNİMİ F-7'dedir (certbot +
# otomatik yenileme). T-1 kabulü için elle üretilmiş/geçici sertifika yeterli.
# ornek.com'u kendi alan adınızla değiştirin.
# ═══════════════════════════════════════════════════════════════════════════

upstream kuyumcu_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── 80: YALNIZ YÖNLENDİRME ─────────────────────────────────────────────────
# TLS'siz hiçbir istek uygulamaya ULAŞMAZ. Tek istisna ACME doğrulama yolu
# (F-7 certbot webroot); o da uygulamaya değil, diske bakar.
server {
    listen 80;
    listen [::]:80;
    server_name ornek.com www.ornek.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ornek.com www.ornek.com;

    ssl_certificate     /etc/letsencrypt/live/ornek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ornek.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── SIKIŞTIRMA (MÜHÜR 6 / K7) ──────────────────────────────────────────
    # gzip ZORUNLU. Brotli (ngx_brotli) OPSİYONELDİR: modül yoksa `brotli`
    # yönergesi `nginx -t`yi DÜŞÜRÜR, bu yüzden buraya yazılmaz; kuran kişi
    # modülü yüklediyse ayrı bir conf parçasıyla ekler (docs/DEPLOY.md).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/wasm image/svg+xml application/octet-stream;

    # Blazor WASM ilk yükleme büyüktür; vekil zaman aşımı buna göre.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── SİSTEM UÇLARI: IP/VEKİL KISITI (K4, mühür 4 — F-2-min üretim kapısı) ─
    # /api/v1/sistem/* kiracı AÇMA uçlarıdır; anahtar kullanıcıya bağlı
    # olmadıkları için MFA onları korumaz. Bu yüzden ağ katmanında kısıtlanır.
    # VARSAYILAN: REDDET. İzin listesi kuran kişi tarafından doldurulur;
    # boş bırakılırsa uç dışarıdan ERİŞİLEMEZ (fail-closed).
    location /api/v1/sistem/ {
        allow 127.0.0.1;
        allow ::1;
        # allow 203.0.113.0/24;   # ← yönetim ağınızı buraya ekleyin
        deny all;

        proxy_pass http://kuyumcu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── BELGE YÜKLEME (paket 4, Mehmet K4-1) ───────────────────────────────
    # nginx varsayılanı 1 MB'dır → 5 MB PDF ucu vekil arkasında 413 alırdı.
    # Sınır SUNUCU GENELİNDE gevşetilmez, yalnız bu iki yolda açılır.
    # 5 MB ham PDF base64'te ~6,7 MB gövde eder → 8m, Kestrel'deki
    # [RequestSizeLimit(8_000_000)] ile aynı hizada.
    location /api/v1/belgeler {
        client_max_body_size 8m;
        proxy_pass http://kuyumcu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/urunler {
        client_max_body_size 8m;
        proxy_pass http://kuyumcu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canlı kur push (SignalR) — WebSocket yükseltmesi.
    location /hubs/ {
        proxy_pass http://kuyumcu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── HER ŞEY UYGULAMAYA ─────────────────────────────────────────────────
    # API de, WASM kabuğu da, /assets/ altındaki statikler de aynı süreçten.
    # Tek hat = tek güvenlik başlığı kümesi.
    location / {
        client_max_body_size 2m;
        proxy_pass http://kuyumcu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
